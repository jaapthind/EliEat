<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JaapGym - Ultimate 3D Fitness Simulator</title>
    <style>
        /* ==========================================================================
           1. CSS RESET & GLOBAL STYLES
           ========================================================================== */
        *, *::before, *::after { box-sizing: border-box; user-select: none; -webkit-user-drag: none; }
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }

        /* ==========================================================================
           2. 3D CANVAS & OVERLAYS
           ========================================================================== */
        #game-canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 6px; height: 6px; background-color: rgba(255, 255, 255, 0.9); border: 1px solid rgba(0, 0, 0, 0.8); border-radius: 50%; z-index: 10; pointer-events: none; }
        #interaction-prompt { position: absolute; top: 55%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 1.2rem; display: none; z-index: 10; border: 2px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .key-btn { background: #fff; color: #000; padding: 2px 8px; border-radius: 4px; border-bottom: 3px solid #ccc; font-family: monospace; margin-right: 5px; }

        /* ==========================================================================
           3. LOADING SCREEN
           ========================================================================== */
        #loading-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #87CEEB; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; transition: opacity 1s ease-out; }
        .loader-ring { width: 120px; height: 120px; border: 12px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: #FFEB3B; border-bottom-color: #4CAF50; animation: spin 1s linear infinite; margin-bottom: 30px; box-shadow: 0 0 30px rgba(255, 235, 59, 0.5); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading-text { font-size: 3rem; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; }

        /* ==========================================================================
           4. HEADS UP DISPLAY (HUD)
           ========================================================================== */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .interactive { pointer-events: auto; }

        /* Top HUD area */
        #top-hud { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }

        /* Stats Panel */
        .hud-panel { background: rgba(20, 25, 30, 0.85); border: 3px solid #222; border-radius: 12px; padding: 20px; color: #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.5); backdrop-filter: blur(8px); min-width: 300px; border-top: 6px solid #4CAF50; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .stat-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .stat-label { font-weight: 800; color: #ccc; text-transform: uppercase; font-size: 1rem; letter-spacing: 1px; }
        .stat-val { font-weight: 900; font-family: 'Courier New', Courier, monospace; font-size: 1.5rem; }
        .val-str { color: #FF5722; text-shadow: 0 0 5px rgba(255, 87, 34, 0.5); }
        .val-spd { color: #00E676; text-shadow: 0 0 5px rgba(0, 230, 118, 0.5); }
        .val-coin { color: #FFD700; text-shadow: 0 0 5px rgba(255, 215, 0, 0.5); }
        .val-gem { color: #00BCD4; text-shadow: 0 0 5px rgba(0, 188, 212, 0.5); }
        .val-rank { color: #E91E63; text-shadow: 0 0 5px rgba(233, 30, 99, 0.5); }

        /* Progress Bar */
        .progress-wrapper { width: 100%; margin-top: 15px; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.95rem; color: #fff; margin-bottom: 5px; font-weight: 900; text-shadow: 1px 1px 2px #000; }
        .progress-container { width: 100%; height: 20px; background: #111; border-radius: 10px; overflow: hidden; border: 2px solid #333; box-shadow: inset 0 3px 6px rgba(0,0,0,0.8); }
        #exp-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #4CAF50, #8BC34A); transition: width 0.3s ease; box-shadow: 0 0 10px rgba(76, 175, 80, 0.8); }

        /* Left Side Menu */
        #side-menu { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 15px; }
        .side-btn { width: 80px; height: 80px; border-radius: 20px; background: linear-gradient(145deg, #2a2a35, #1e1e25); border: 3px solid #444; color: white; cursor: pointer; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; justify-content: center; align-items: center; flex-direction: column; font-size: 0.8rem; font-weight: 900; text-transform: uppercase; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        .side-btn:hover { background: linear-gradient(145deg, #4CAF50, #388E3C); border-color: #fff; transform: scale(1.1) translateX(15px); box-shadow: 0 12px 25px rgba(76, 175, 80, 0.5); }
        .side-btn svg { width: 32px; height: 32px; fill: white; margin-bottom: 5px; }
        .side-btn.sell-btn { background: linear-gradient(145deg, #2196F3, #1565C0); border-color: #64B5F6; }
        .side-btn.sell-btn:hover { background: linear-gradient(145deg, #42A5F5, #1976D2); }
        .side-btn.rebirth-btn { background: linear-gradient(145deg, #9C27B0, #6A1B9A); border-color: #BA68C8; }
        .side-btn.rebirth-btn:hover { background: linear-gradient(145deg, #AB47BC, #8E24AA); }

        /* Bottom Controls / Hotbar */
        #bottom-hud { display: flex; flex-direction: column; align-items: center; width: 100%; margin-bottom: 20px; position: relative; gap: 15px; }
        #hotbar { display: flex; gap: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 12px; border: 2px solid #333; }
        .hotbar-slot { width: 60px; height: 60px; background: rgba(255,255,255,0.1); border: 2px solid #555; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.5rem; color: #aaa; position: relative; cursor: pointer; transition: 0.2s; }
        .hotbar-slot.active { border-color: #4CAF50; background: rgba(76, 175, 80, 0.3); color: #fff; transform: translateY(-5px); box-shadow: 0 5px 15px rgba(76, 175, 80, 0.5); }
        .hotbar-num { position: absolute; top: 2px; left: 4px; font-size: 0.7rem; color: #fff; background: rgba(0,0,0,0.8); padding: 1px 4px; border-radius: 4px; }
        .hotbar-img { font-size: 2rem; }
        
        #btn-action { background: linear-gradient(180deg, #FF5252, #D32F2F); border: 4px solid #FF8A80; padding: 20px 80px; border-radius: 50px; color: white; font-size: 2.2rem; font-weight: 900; cursor: pointer; box-shadow: 0 15px 30px rgba(211, 47, 47, 0.6), inset 0 5px 15px rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 4px; transition: all 0.1s; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); display: none; }
        #btn-action:active { transform: translateY(8px) scale(0.95); box-shadow: 0 5px 10px rgba(211, 47, 47, 0.6), inset 0 2px 5px rgba(255,255,255,0.4); }
        
        #controls-hint { position: absolute; bottom: 0; right: 0; background: rgba(0,0,0,0.8); padding: 15px 25px; border-radius: 12px; color: #fff; font-size: 1rem; font-weight: bold; text-align: right; border: 2px solid #555; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }

        /* Notifications */
        #notification-container { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 15px; align-items: center; pointer-events: none; z-index: 1000; }
        .toast { background: rgba(20,25,30,0.95); border-left: 8px solid #4CAF50; padding: 20px 40px; border-radius: 12px; color: white; font-weight: 900; font-size: 1.5rem; box-shadow: 0 15px 30px rgba(0,0,0,0.7); animation: slideDown 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, fadeOut 0.4s ease-in 2.5s forwards; opacity: 0; text-transform: uppercase; letter-spacing: 2px; }
        @keyframes slideDown { 0% { transform: translateY(-50px) scale(0.8); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
        @keyframes fadeOut { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-30px); } }

        /* Floating Text Effects */
        .float-text { position: absolute; pointer-events: none; font-weight: 900; font-size: 3rem; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 8px 20px rgba(0,0,0,0.8); z-index: 500; animation: floatUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .float-str { color: #FF5722; }
        .float-spd { color: #00E676; }
        @keyframes floatUp { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; } 40% { transform: translate(-50%, -150%) scale(1.3); opacity: 1; } 100% { transform: translate(-50%, -300%) scale(1); opacity: 0; } }

        /* ==========================================================================
           5. WINDOW MODALS (SHOP, REBIRTH, SETTINGS)
           ========================================================================== */
        .window-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background: rgba(20, 25, 30, 0.98); border: 4px solid #444; border-radius: 24px; width: 1000px; height: 750px; display: none; flex-direction: column; z-index: 500; box-shadow: 0 30px 80px rgba(0,0,0,0.9), 0 0 0 100vw rgba(0,0,0,0.8); opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); overflow: hidden; }
        .window-modal.active { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 25px 40px; background: linear-gradient(90deg, #1a1a2e, #16213e); border-bottom: 4px solid #4CAF50; }
        .modal-title { font-size: 3rem; font-weight: 900; color: white; margin: 0; text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 0 15px rgba(76, 175, 80, 0.6); }
        .close-btn { background: #F44336; border: 3px solid #D32F2F; width: 60px; height: 60px; border-radius: 50%; color: white; font-size: 2.5rem; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; box-shadow: 0 5px 15px rgba(244, 67, 54, 0.5); }
        .close-btn:hover { background: #D32F2F; transform: rotate(90deg) scale(1.1); }
        .modal-body { display: flex; flex: 1; overflow: hidden; }
        .modal-tabs { width: 280px; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; padding: 20px; gap: 15px; border-right: 3px solid #333; }
        .tab-btn { background: rgba(255,255,255,0.05); border: 3px solid transparent; color: #aaa; padding: 20px; text-align: left; font-size: 1.3rem; font-weight: 900; cursor: pointer; border-radius: 16px; transition: 0.2s; text-transform: uppercase; letter-spacing: 2px; }
        .tab-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .tab-btn.active { background: linear-gradient(90deg, rgba(76, 175, 80, 0.3), transparent); border-left-color: #4CAF50; color: white; text-shadow: 0 0 8px rgba(76, 175, 80, 0.8); }
        .modal-content-area { flex: 1; padding: 30px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; align-content: start; background: radial-gradient(circle at center, #1e1e28, #111118); }
        .modal-content-area::-webkit-scrollbar { width: 12px; }
        .modal-content-area::-webkit-scrollbar-track { background: #111; border-left: 1px solid #333; }
        .modal-content-area::-webkit-scrollbar-thumb { background: #555; border-radius: 6px; border: 3px solid #111; }

        /* Shop Items */
        .shop-item { background: linear-gradient(180deg, #2a2a35, #1a1a25); border: 3px solid #444; border-radius: 20px; padding: 25px; display: flex; flex-direction: column; align-items: center; text-align: center; transition: 0.2s; box-shadow: 0 12px 25px rgba(0,0,0,0.6); position: relative; overflow: hidden; }
        .shop-item::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent); pointer-events: none; }
        .shop-item:hover { border-color: #4CAF50; transform: translateY(-8px); box-shadow: 0 20px 40px rgba(76, 175, 80, 0.3); }
        .item-icon-container { width: 120px; height: 120px; background: rgba(0,0,0,0.6); border-radius: 50%; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; font-size: 4rem; border: 4px solid #555; box-shadow: inset 0 0 30px rgba(0,0,0,0.9); }
        .item-name { font-weight: 900; color: white; font-size: 1.5rem; margin-bottom: 10px; text-transform: uppercase; }
        .item-desc { color: #4CAF50; font-weight: 900; font-size: 1.2rem; margin-bottom: 25px; flex: 1; text-shadow: 0 0 8px rgba(76, 175, 80, 0.4); }
        .buy-btn { width: 100%; padding: 18px; border: none; border-radius: 12px; font-weight: 900; font-size: 1.3rem; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 2px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .buy-btn.coins { background: #FFC107; color: #000; box-shadow: 0 6px 15px rgba(255, 193, 7, 0.5); }
        .buy-btn.gems { background: #00BCD4; color: #000; box-shadow: 0 6px 15px rgba(0, 188, 212, 0.5); }
        .buy-btn:hover:not(:disabled) { transform: scale(1.05); filter: brightness(1.2); }
        .buy-btn:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; border: 2px solid #555; }
        .equipped-badge { display: none; background: linear-gradient(90deg, #4CAF50, #00BCD4); color: #fff; padding: 15px; border-radius: 12px; font-size: 1.3rem; font-weight: 900; margin-top: 15px; width: 100%; text-transform: uppercase; box-shadow: 0 0 20px rgba(76, 175, 80, 0.6); border: 2px solid #fff; }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader-ring"></div>
        <div id="loading-text">JAAPGYM 3D</div>
    </div>

    <div id="game-canvas-container"></div>
    <div id="crosshair"></div>
    <div id="interaction-prompt"><span class="key-btn">E</span> to Use</div>

    <div id="ui-layer">
        <div id="top-hud">
            <div id="player-stats" class="hud-panel interactive">
                <div class="stat-row">
                    <span class="stat-label">Strength</span>
                    <span class="stat-val val-str" id="ui-strength">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Speed</span>
                    <span class="stat-val val-spd" id="ui-speed">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Coins</span>
                    <span class="stat-val val-coin" id="ui-coins">0</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Gems</span>
                    <span class="stat-val val-gem" id="ui-gems">0</span>
                </div>
                <div class="stat-row" style="margin-top: 20px; border-top: 3px solid #555; padding-top: 20px;">
                    <span class="stat-label">Current Rank</span>
                    <span class="stat-val val-rank" id="ui-rank">Scrawny</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Power Multiplier</span>
                    <span class="stat-val" style="color: #fff; text-shadow: 0 0 8px #fff;" id="ui-mult">x1.0</span>
                </div>
                <div class="progress-wrapper">
                    <div class="progress-label">
                        <span id="ui-level-text">Level 1</span>
                        <span id="ui-exp-text">0 / 100 XP</span>
                    </div>
                    <div class="progress-container">
                        <div id="exp-bar"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="side-menu" class="interactive">
            <button class="side-btn" id="btn-shop">
                <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                Shop
            </button>
            <button class="side-btn sell-btn" id="btn-sell">
                <svg viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
                Sell
            </button>
            <button class="side-btn rebirth-btn" id="btn-rebirth">
                <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
                Rebirth
            </button>
            <button class="side-btn" id="btn-settings" style="background: linear-gradient(145deg, #607D8B, #455A64);">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                Config
            </button>
        </div>

        <div id="bottom-hud">
            <button id="btn-action" class="interactive">LIFT (CLICK/SPACE)</button>
            <div id="hotbar" class="interactive">
                <div class="hotbar-slot active" id="slot-1"><span class="hotbar-num">1</span><span class="hotbar-img">🏋️</span></div>
                <div class="hotbar-slot" id="slot-2"><span class="hotbar-num">2</span><span class="hotbar-img">🥊</span></div>
                <div class="hotbar-slot" id="slot-3"><span class="hotbar-num">3</span><span class="hotbar-img">🥤</span></div>
            </div>
            <div id="controls-hint">WASD = Move | Right Click = Look | Scroll = Zoom | 1-3 = Equip | E = Interact</div>
        </div>
    </div>

    <div id="notification-container"></div>

    <div id="modal-container" class="window-modal interactive">
        <div class="modal-header">
            <h2 class="modal-title" id="modal-title">Shop Menu</h2>
            <button class="close-btn" id="btn-close-modal">×</button>
        </div>
        <div class="modal-body">
            <div class="modal-tabs" id="modal-tabs"></div>
            <div class="modal-content-area" id="modal-content"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        /* =========================================================================================
                                     MASSIVE GAME DATABASE
           ========================================================================================= */
        const DB = {
            weights: [
                { id: 'w_1', name: 'Pencil', power: 1, cost: 0, scale: 0.8, color: 0xFFD700, type: 'dumbbell' },
                { id: 'w_2', name: 'Twig', power: 2, cost: 25, scale: 0.9, color: 0x8B4513, type: 'dumbbell' },
                { id: 'w_3', name: 'Plastic Bottle', power: 5, cost: 100, scale: 1.0, color: 0x4FC3F7, type: 'dumbbell' },
                { id: 'w_4', name: 'Rock', power: 15, cost: 400, scale: 1.1, color: 0x757575, type: 'dumbbell' },
                { id: 'w_5', name: 'Brick', power: 40, cost: 1500, scale: 1.2, color: 0xB71C1C, type: 'dumbbell' },
                { id: 'w_6', name: 'Wooden Dumbbell', power: 100, cost: 5000, scale: 1.3, color: 0x795548, type: 'dumbbell' },
                { id: 'w_7', name: 'Iron Dumbbell', power: 300, cost: 20000, scale: 1.4, color: 0x607D8B, type: 'dumbbell' },
                { id: 'w_8', name: 'Steel Barbell', power: 1000, cost: 85000, scale: 1.6, color: 0x9E9E9E, type: 'barbell' },

        function formatNum(n) {
            if (n >= 1e15) return (n / 1e15).toFixed(2) + 'Qa';
            if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
            if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
            if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(2) + 'K';
            return Math.floor(n).toString();
        }

            buildShop() {
                this.els.mTitle.innerText = "Shop Menu";

                    <button class="tab-btn active" onclick="UI.renderShop('weights', event)">Weights (Coins)</button>
                    <button class="tab-btn" onclick="UI.renderShop('dna', event)">DNA (Coins)</button>

            renderShop(cat, e) {
                if(e) { Array.from(this.els.mTabs.children).forEach(c=>c.classList.remove('active')); e.target.classList.add('active'); }
                else { this.els.mTabs.children[0].classList.add('active'); }

                this.els.mContent.innerHTML = '';
                DB[cat].forEach(item => {
                    let owned = STATE.inventory[cat].includes(item.id);
                    let eq = STATE.equipped[cat==='weights'?'weight':(cat==='dna'?'dna':'pet')] === item.id;
                    let canBuy = cat==='pets' ? STATE.gems >= item.costGems : STATE.coins >= item.cost;
                    
                    let btnHTML = '';
                    if(eq) btnHTML = `<div class="equipped-badge" style="display:block">Equipped</div>`;
                    else if(owned) btnHTML = `<button class="buy-btn gems" onclick="GAME.equip('${cat}', '${item.id}')">Equip</button>`;
                    else btnHTML = `<button class="buy-btn ${cat==='pets'?'gems':'coins'}" ${!canBuy?'disabled':''} onclick="GAME.buy('${cat}', '${item.id}')">Buy: ${formatNum(cat==='pets'?item.costGems:item.cost)}</button>`;

                    let txt = cat==='weights' ? `+${formatNum(item.power)} Power` : (cat==='dna' ? `x${formatNum(item.mult)} Multiplier` : `x${formatNum(item.mult)} Total Mult`);
                    let ico = cat==='weights' ? '🏋️' : (cat==='dna' ? '🧬' : '🐶');

                    this.els.mContent.innerHTML += `
                        <div class="shop-item">

                            <div class="item-name">${item.name}</div>

            setHotbar(slot) {

                STATE.hotbarSlot = STATE.hotbarSlot === slot ? 0 : slot; // Toggle

                if(RENDERER) RENDERER.updateEquippedItem();

                    STATE.coins = 0; STATE.strength = 0; STATE.speed = 0; STATE.level = 1; STATE.exp = 0;

        /* =========================================================================================
                                     GAME LOGIC CONTROLLER
           ========================================================================================= */
        const GAME = {
            buy(cat, id) {
                let item = getDB(cat, id); let cost = cat==='pets' ? item.costGems : item.cost;
                if(cat==='pets' ? STATE.gems >= cost : STATE.coins >= cost) {
                    if(cat==='pets') STATE.gems -= cost; else STATE.coins -= cost;
                    STATE.inventory[cat].push(id); this.equip(cat, id);
                    UI.notify(`Purchased ${item.name}!`);
                }
            },
            equip(cat, id) {
                if(cat==='weights') STATE.equipped.weight = id;
                if(cat==='dna') STATE.equipped.dna = id;
                if(cat==='pets') STATE.equipped.pet = id;
                UI.renderShop(cat, null); UI.update(); saveGame();
                if(RENDERER && STATE.hotbarSlot === 1) RENDERER.updateEquippedItem();
            },
            toggleShadows() {
                STATE.settings.shadows = !STATE.settings.shadows; UI.buildSettings();
                if(RENDERER) RENDERER.applyShadowSettings(); saveGame();
            },
            hardReset() { localStorage.removeItem('jaapGym3DSave_Extreme'); location.reload(); },
            
            doAction() {
                if(UI.els.modal.classList.contains('active') || STATE.isInteracting) return;

                if(STATE.hotbarSlot === 1) {
                    // LIFTING
                    if(STATE.animState === 'lift') return;
                    STATE.animState = 'lift';
                    
                    let w = getDB('weights', STATE.equipped.weight);
                    let d = getDB('dna', STATE.equipped.dna);
                    let p = STATE.equipped.pet ? getDB('pets', STATE.equipped.pet).mult : 1;
                    
                    let gain = w.power * d.mult * (1 + (STATE.rebirths * 2.0)) * p;
                    STATE.strength += gain; STATE.exp += 20;
                    
                    this.checkLevelUp(); UI.update(); RENDERER.updatePlayerScale();
                    PARTICLES.spawnSweat(); UI.floatText(gain, 'str');
                }
                else if(STATE.hotbarSlot === 2) {
                    // PUNCHING
                    if(STATE.animState === 'punch') return;
                    STATE.animState = 'punch';
                    // Punching gives small strength and speed
                    let gain = (STATE.level * 10) * (1 + STATE.rebirths);
                    STATE.strength += gain; STATE.speed += gain * 0.5; STATE.exp += 10;
                    this.checkLevelUp(); UI.update();
                    PARTICLES.spawnSweat(); UI.floatText(gain, 'str');
                }
            },

            checkLevelUp() {
                let req = STATE.level * 200;
                if(STATE.exp >= req) {
                    STATE.exp -= req; STATE.level++;
                    UI.notify(`LEVEL UP! You are now Level ${STATE.level}`, '#00BCD4');
                    PARTICLES.spawnConfetti();
                }
            },

            interact() {
                if(STATE.isInteracting) {
                    // Stop interacting
                    STATE.isInteracting = false;
                    STATE.interactTarget = null;
                    STATE.animState = 'idle';
                    UI.setHotbar(0); // Unequip
                } else if(INTERACTIONS.currentTarget) {
                    // Start interacting
                    STATE.isInteracting = true;
                    STATE.interactTarget = INTERACTIONS.currentTarget;
                    UI.setHotbar(0); // Hide weapons
                    
                    // Snap player to target position
                    PLAYER.group.position.copy(STATE.interactTarget.usePos);
                    PLAYER.group.rotation.y = STATE.interactTarget.useRot;
                    
                    if(STATE.interactTarget.type === 'treadmill') {
                        STATE.animState = 'run_treadmill';
                    }
                }
            }
        };

        document.getElementById('btn-action').addEventListener('mousedown', () => GAME.doAction());
        document.addEventListener('keydown', e => {
            if(e.code === 'Space' && !STATE.isInteracting) { e.preventDefault(); GAME.doAction(); }
            if(e.code === 'Digit1') UI.setHotbar(1);
            if(e.code === 'Digit2') UI.setHotbar(2);
            if(e.code === 'Digit3') UI.setHotbar(3);
            if(e.code === 'KeyE') GAME.interact();
        });

        /* =========================================================================================
                                     THREE.JS ENGINE & PROCEDURAL MAP
           ========================================================================================= */
        let RENDERER, PARTICLES, PLAYER, INTERACTIONS;

        function initEngine() {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Bright day
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.0015);

            const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 3000);
            
            const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('game-canvas-container').appendChild(renderer.domElement);

            // Bright Lighting
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0xffffff, 0.8);
            hemiLight.position.set(0, 500, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffee, 1.5);
            dirLight.position.set(200, 400, 100);
            dirLight.shadow.camera.top = 500; dirLight.shadow.camera.bottom = -500;
            dirLight.shadow.camera.left = -500; dirLight.shadow.camera.right = 500;
            dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // Material Library
            const Mats = {
                floorBase: new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9, metalness: 0.1 }),
                floorWood: new THREE.MeshStandardMaterial({ color: 0x8D6E63, roughness: 0.8 }),
                wallExt: new THREE.MeshStandardMaterial({ color: 0xE0E0E0, roughness: 1.0 }),
                wallInt: new THREE.MeshStandardMaterial({ color: 0xFAFAFA, roughness: 0.9 }),
                glass: new THREE.MeshPhysicalMaterial({ color: 0x87CEEB, transparent: true, opacity: 0.4, roughness: 0.1, metalness: 0.9 }),
                metalDark: new THREE.MeshStandardMaterial({ color: 0x212121, roughness: 0.4, metalness: 0.8 }),
                metalLight: new THREE.MeshStandardMaterial({ color: 0x9E9E9E, roughness: 0.3, metalness: 0.9 }),
                leatherRed: new THREE.MeshStandardMaterial({ color: 0xB71C1C, roughness: 0.7 }),
                leatherBlack: new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 }),
                neonGreen: new THREE.MeshStandardMaterial({ color: 0x00E676, emissive: 0x00E676, emissiveIntensity: 0.5 }),
                belt: new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.9 })
            };

            const mapGrp = new THREE.Group(); scene.add(mapGrp);
            const interactables = [];

            // Architecture
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), Mats.floorBase);
            floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; mapGrp.add(floor);
            
            const grid = new THREE.GridHelper(1000, 200, 0x000000, 0x222222);
            grid.position.y = 0.1; grid.material.opacity = 0.5; grid.material.transparent = true; mapGrp.add(grid);

            function addBox(w,h,d, x,y,z, mat, cast=true) {
                let m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
                m.position.set(x,y,z); m.castShadow = cast; m.receiveShadow = true;
                mapGrp.add(m); return m;
            }

            // Outer Walls
            addBox(800, 60, 4, 0, 30, -400, Mats.wallExt); // North
            addBox(800, 60, 4, 0, 30, 400, Mats.wallExt);  // South
            addBox(4, 60, 800, -400, 30, 0, Mats.wallExt); // West
            addBox(4, 60, 800, 400, 30, 0, Mats.wallExt);  // East

            // Huge Windows on South Wall
            addBox(700, 40, 5, 0, 35, 400, Mats.glass, false);

            // --- PROCEDURAL EQUIPMENT GENERATORS ---
            
            function genTreadmill(x, z, rot) {
                const g = new THREE.Group();
                let base = new THREE.Mesh(new THREE.BoxGeometry(4, 0.8, 10), Mats.metalDark); base.position.y=0.4; base.castShadow=true;
                let belt = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.9, 9.5), Mats.belt); belt.position.y=0.4;
                let armL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 5, 0.6), Mats.metalDark); armL.position.set(-1.8, 2.5, -4); armL.rotation.x=-0.2; armL.castShadow=true;
                let armR = armL.clone(); armR.position.set(1.8, 2.5, -4);
                let panel = new THREE.Mesh(new THREE.BoxGeometry(4, 2, 0.3), Mats.metalDark); panel.position.set(0, 5, -4.5); panel.rotation.x=-0.5; panel.castShadow=true;
                let screen = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 1.6), new THREE.MeshBasicMaterial({color:0x00B0FF})); screen.position.set(0, 5, -4.34); screen.rotation.x=-0.5;
                g.add(base, belt, armL, armR, panel, screen);
                g.position.set(x,0,z); g.rotation.y=rot; mapGrp.add(g);

                // Add to interactables
                let usePos = new THREE.Vector3(x, 0, z).add(new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0), rot));
                interactables.push({ type: 'treadmill', pos: new THREE.Vector3(x,0,z), radius: 6, usePos: usePos, useRot: rot, belt: belt });
            }

            function genBench(x, z, rot) {
                const g = new THREE.Group();
                let pad = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.5, 8), Mats.leatherRed); pad.position.y=2; pad.castShadow=true;
                let f1 = new THREE.Mesh(new THREE.BoxGeometry(0.5,2,0.5), Mats.metalDark); f1.position.set(0,1,3); f1.castShadow=true;
                let f2 = f1.clone(); f2.position.set(-1,1,-3); let f3 = f1.clone(); f3.position.set(1,1,-3);
                let rL = new THREE.Mesh(new THREE.BoxGeometry(0.4,4.5,0.4), Mats.metalDark); rL.position.set(-1.5,2.25,-3); rL.castShadow=true;
                let rR = rL.clone(); rR.position.set(1.5,2.25,-3);
                let bar = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,6), Mats.metalLight); bar.rotation.z=Math.PI/2; bar.position.set(0,4.5,-3); bar.castShadow=true;
                let p1 = new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,0.3), Mats.metalDark); p1.rotation.z=Math.PI/2; p1.position.set(-2.5,4.5,-3); p1.castShadow=true;
                let p2 = p1.clone(); p2.position.set(2.5,4.5,-3);
                g.add(pad, f1, f2, f3, rL, rR, bar, p1, p2);
                g.position.set(x,0,z); g.rotation.y=rot; mapGrp.add(g);
            }

            function genPunchingBag(x, z) {
                const g = new THREE.Group();
                let base = new THREE.Mesh(new THREE.CylinderGeometry(2,2,0.5), Mats.metalDark); base.position.y=0.25; base.castShadow=true;
                let pole = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,10), Mats.metalDark); pole.position.set(-1.5, 5, 0); pole.castShadow=true;
                let top = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.2, 0.4), Mats.metalDark); top.position.set(0, 10, 0); top.castShadow=true;
                let chain = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1), Mats.metalLight); chain.position.set(1.5, 9.5, 0);
                let bag = new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,4), Mats.leatherBlack); bag.position.set(1.5, 7, 0); bag.castShadow=true;
                g.add(base, pole, top, chain, bag);
                g.position.set(x,0,z); mapGrp.add(g);
            }

            function genDumbbellRack(x, z, rot) {
                const g = new THREE.Group();
                let s1 = new THREE.Mesh(new THREE.BoxGeometry(16, 0.2, 1.5), Mats.metalDark); s1.position.set(0,2,0); s1.rotation.x=0.2; s1.castShadow=true;
                let s2 = s1.clone(); s2.position.set(0,4,-0.5);
                let legL = new THREE.Mesh(new THREE.BoxGeometry(0.5, 5, 2), Mats.metalDark); legL.position.set(-8,2.5,0); legL.castShadow=true;
                let legR = legL.clone(); legR.position.set(8,2.5,0);
                g.add(s1,s2,legL,legR);
                for(let i=0; i<8; i++) {
                    let db = new THREE.Group();
                    let h = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,1), Mats.metalLight); h.rotation.z=Math.PI/2;
                    let w1 = new THREE.Mesh(new THREE.CylinderGeometry(0.4+i*0.05,0.4+i*0.05,0.3), Mats.metalDark); w1.rotation.z=Math.PI/2; w1.position.x=-0.4;
                    let w2 = w1.clone(); w2.position.x=0.4;
                    db.add(h,w1,w2); db.castShadow=true;
                    let d1 = db.clone(); d1.position.set(-7 + i*2, 2.2, 0.2); d1.rotation.x=0.2;
                    let d2 = db.clone(); d2.scale.set(1.2,1.2,1.2); d2.position.set(-7 + i*2, 4.3, -0.3); d2.rotation.x=0.2;
                    g.add(d1,d2);
                }
                g.position.set(x,0,z); g.rotation.y=rot; mapGrp.add(g);
            }

            function genSellZone() {
                const g = new THREE.Group();
                let base = new THREE.Mesh(new THREE.CylinderGeometry(20, 20, 1, 32), Mats.metalDark); base.position.y=0.5; base.receiveShadow=true;
                let ring = new THREE.Mesh(new THREE.TorusGeometry(18, 0.5, 16, 64), Mats.neonGreen); ring.position.y=1.2; ring.rotation.x=Math.PI/2;
                let holo = new THREE.Mesh(new THREE.CylinderGeometry(18, 18, 30, 32), new THREE.MeshBasicMaterial({color: 0x00E676, transparent: true, opacity: 0.1, side: THREE.DoubleSide, blending: THREE.AdditiveBlending})); holo.position.y=15;
                g.add(base, ring, holo); g.position.set(0,0,0); mapGrp.add(g);
                return holo; // for rotation
            }

            // --- POPULATE MAP ---
            const holoCylinder = genSellZone();

            // Cardio Zone (Massive)
            for(let i=0; i<30; i++) {
                genTreadmill(150, -300 + i*15, -Math.PI/2);
                genTreadmill(200, -300 + i*15, -Math.PI/2);
                genTreadmill(250, -300 + i*15, -Math.PI/2);
            }

            // Weight Zone
            for(let i=0; i<10; i++) {
                genBench(-100, -200 + i*25, Math.PI/2);
                genBench(-160, -200 + i*25, Math.PI/2);
            }
            genDumbbellRack(-250, -200, Math.PI/2);
            genDumbbellRack(-250, -100, Math.PI/2);
            genDumbbellRack(-250, 0, Math.PI/2);

            // Boxing Zone
            for(let i=0; i<15; i++) {
                genPunchingBag(-150 + i*15, 200);
            }

            // --- PLAYER RIG (ROBLOX R15 STYLE) ---
            const pGrp = new THREE.Group(); scene.add(pGrp);
            PLAYER = { group: pGrp, scale: 1 };

            const skinMat = new THREE.MeshStandardMaterial({color: 0xFFCC99, roughness: 0.6});
            const shirtMat = new THREE.MeshStandardMaterial({color: 0x1976D2, roughness: 0.8});
            const pantsMat = new THREE.MeshStandardMaterial({color: 0x212121, roughness: 0.9});

            const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), skinMat); head.position.y=4.2; head.castShadow=true; pGrp.add(head);
            // Face Decal
            const face = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.4), new THREE.MeshBasicMaterial({color: 0x000})); face.position.set(0, 4.3, 0.61); pGrp.add(face);

            const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2.5, 1), shirtMat); torso.position.y=2.5; torso.castShadow=true; pGrp.add(torso);

            const rArmGrp = new THREE.Group(); rArmGrp.position.set(1.5, 3.5, 0);
            const rArm = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.5, 0.8), skinMat); rArm.position.y=-1; rArm.castShadow=true; rArmGrp.add(rArm); pGrp.add(rArmGrp);

            const lArmGrp = new THREE.Group(); lArmGrp.position.set(-1.5, 3.5, 0);
            const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.8, 2.5, 0.8), skinMat); lArm.position.y=-1; lArm.castShadow=true; lArmGrp.add(lArm); pGrp.add(lArmGrp);

            const rLegGrp = new THREE.Group(); rLegGrp.position.set(0.5, 1.25, 0);
            const rLeg = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2.5, 0.9), pantsMat); rLeg.position.y=-1.25; rLeg.castShadow=true; rLegGrp.add(rLeg); pGrp.add(rLegGrp);

            const lLegGrp = new THREE.Group(); lLegGrp.position.set(-0.5, 1.25, 0);
            const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2.5, 0.9), pantsMat); lLeg.position.y=-1.25; lLeg.castShadow=true; lLegGrp.add(lLeg); pGrp.add(lLegGrp);

            const handAnchor = new THREE.Group(); handAnchor.position.set(0, -2, 0); rArmGrp.add(handAnchor);
            let currentEquip = null;

            // --- PARTICLES ---
            const pSysGrp = new THREE.Group(); scene.add(pSysGrp);
            const pArr = [];
            PARTICLES = {
                spawnConfetti() {
                    if(!STATE.settings.particles) return;
                    const cols = [0xFF0000, 0x00FF00, 0x0000FF, 0xFFFF00, 0xFF00FF, 0x00FFFF];
                    const g = new THREE.BoxGeometry(0.4, 0.4, 0.4);
                    for(let i=0; i<50; i++) {
                        let m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({color: cols[Math.floor(Math.random()*cols.length)]}));
                        m.position.copy(pGrp.position); m.position.y += 12 * PLAYER.scale;
                        pSysGrp.add(m);
                        pArr.push({ m:m, v:new THREE.Vector3((Math.random()-0.5)*20, Math.random()*30, (Math.random()-0.5)*20), life: 3.0 });
                    }
                },
                spawnSweat() {
                    if(!STATE.settings.particles) return;
                    let m = new THREE.Mesh(new THREE.SphereGeometry(0.2,4,4), new THREE.MeshBasicMaterial({color:0x87CEEB, transparent:true, opacity:0.7}));
                    m.position.copy(pGrp.position); m.position.y += 5 * PLAYER.scale;
                    m.position.x += (Math.random()-0.5)*3; m.position.z += (Math.random()-0.5)*3;
                    pSysGrp.add(m);
                    pArr.push({ m:m, v:new THREE.Vector3(0, -8, 0), life: 0.6 });
                },
                update(dt) {
                    for(let i=pArr.length-1; i>=0; i--) {
                        let p = pArr[i]; p.life -= dt;
                        p.v.y -= 40 * dt; // gravity
                        p.m.position.addScaledVector(p.v, dt);
                        p.m.rotation.x += p.v.y*dt; p.m.rotation.y += p.v.x*dt;
                        if(p.m.position.y < 0.2) p.m.position.y = 0.2;
                        if(p.life <= 0) { pSysGrp.remove(p.m); p.m.geometry.dispose(); p.m.material.dispose(); pArr.splice(i,1); }
                    }
                }
            };

            // --- RENDERER EXPORTS ---
            RENDERER = {
                updatePlayerScale() {
                    let s = 1 + Math.min(Math.log10(STATE.strength + 1) * 0.12, 5.0);
                    PLAYER.scale = s;
                    pGrp.scale.lerp(new THREE.Vector3(s, s, s), 0.1);
                },
                updateEquippedItem() {
                    if(currentEquip) { handAnchor.remove(currentEquip); currentEquip.geometry.dispose(); currentEquip.material.dispose(); currentEquip = null; }
                    
                    if(STATE.hotbarSlot === 1) {
                        let wD = getDB('weights', STATE.equipped.weight);
                        const g = new THREE.Group();
                        const mat = new THREE.MeshStandardMaterial({color: wD.color, metalness:0.7, roughness:0.3});
                        const h = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,1.5), Mats.metalDark);
                        
                        if(wD.type === 'dumbbell') {
                            let w1 = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.4), mat); w1.position.y=0.75;
                            let w2 = w1.clone(); w2.position.y=-0.75;
                            g.add(h, w1, w2);
                        } else {
                            h.scale.y = 3.5;
                            let w1 = new THREE.Mesh(new THREE.CylinderGeometry(1.0,1.0,0.3), mat); w1.position.y=2.5;
                            let w2 = w1.clone(); w2.position.y=-2.5;
                            g.add(h, w1, w2);
                        }
                        
                        g.scale.set(wD.scale, wD.scale, wD.scale);
                        g.rotation.x = Math.PI/2; g.position.z = 0.5;
                        currentEquip = g; handAnchor.add(currentEquip);
                    }
                },
                applyShadowSettings() {
                    renderer.shadowMap.enabled = STATE.settings.shadows;
                    dirLight.castShadow = STATE.settings.shadows;
                    scene.traverse(c => { if(c.isMesh && c.geometry.type !== 'PlaneGeometry') { c.castShadow = STATE.settings.shadows; c.receiveShadow = STATE.settings.shadows; } });
                }
            };

            INTERACTIONS = {
                list: interactables,
                currentTarget: null,
                check(playerPos) {
                    let found = null;
                    for(let i=0; i<this.list.length; i++) {
                        if(playerPos.distanceTo(this.list[i].pos) < this.list[i].radius * PLAYER.scale) {
                            found = this.list[i]; break;
                        }
                    }
                    if(found && !STATE.isInteracting) {
                        UI.els.prompt.style.display = 'block';
                        this.currentTarget = found;
                    } else if(!STATE.isInteracting) {
                        UI.els.prompt.style.display = 'none';
                        this.currentTarget = null;
                    }
                }
            };

            // Init Visuals
            RENDERER.updateEquippedItem(); RENDERER.applyShadowSettings();

            // Inputs
            const keys = { w:false, a:false, s:false, d:false, shift:false };
            document.addEventListener('keydown', e => { let k=e.key.toLowerCase(); if(keys.hasOwnProperty(k)) keys[k]=true; });
            document.addEventListener('keyup', e => { let k=e.key.toLowerCase(); if(keys.hasOwnProperty(k)) keys[k]=false; });

            let camP = { radius: 30, theta: Math.PI/4, phi: Math.PI/3 };
            let isDrag = false;
            document.getElementById('game-canvas-container').addEventListener('mousedown', e => { if(e.button===2 || e.button===0) isDrag=true; });
            document.addEventListener('mouseup', () => isDrag=false);
            document.addEventListener('mousemove', e => {
                if(isDrag && !UI.els.modal.classList.contains('active')) {
                    camP.theta -= e.movementX * 0.005; camP.phi -= e.movementY * 0.005;
                    camP.phi = Math.max(0.1, Math.min(Math.PI/2.1, camP.phi));
                }
            });
            document.addEventListener('wheel', e => { camP.radius += e.deltaY * 0.05; camP.radius = Math.max(10, Math.min(100, camP.radius)); });
            document.addEventListener('contextmenu', e => e.preventDefault());

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            setTimeout(() => {
                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(()=>document.getElementById('loading-screen').style.display = 'none', 1000);
            }, 500);

            // --- MAIN LOOP ---
            const clock = new THREE.Clock();
            let vel = new THREE.Vector3();
            let animTime = 0;
            let liftPhase = 0;
            let punchPhase = 0;

            function animate() {
                requestAnimationFrame(animate);
                let dt = Math.min(clock.getDelta(), 0.1);

                holoCylinder.rotation.y += dt * 0.5;

                // Physics & Movement
                if(!UI.els.modal.classList.contains('active')) {
                    
                    if(!STATE.isInteracting) {
                        let dir = new THREE.Vector3();
                        if(keys.w) dir.z -= 1; if(keys.s) dir.z += 1;
                        if(keys.a) dir.x -= 1; if(keys.d) dir.x += 1;
                        dir.normalize();

                        if(dir.lengthSq() > 0.1) {
                            let cDir = new THREE.Vector3(); camera.getWorldDirection(cDir); cDir.y=0; cDir.normalize();
                            let cRight = new THREE.Vector3().crossVectors(cDir, new THREE.Vector3(0,1,0)).normalize();
                            let mVec = new THREE.Vector3().addScaledVector(cRight, dir.x).addScaledVector(cDir, -dir.z).normalize();
                            
                            let spd = 40.0 + (STATE.speed * 0.05); // Speed stat makes you faster
                            vel.x = mVec.x * spd; vel.z = mVec.z * spd;

                            let tRot = Math.atan2(vel.x, vel.z);
                            let dRot = tRot - pGrp.rotation.y;
                            while(dRot < -Math.PI) dRot += Math.PI*2; while(dRot > Math.PI) dRot -= Math.PI*2;
                            pGrp.rotation.y += dRot * 15 * dt;

                            STATE.animState = 'walk';
                        } else {
                            vel.x -= vel.x * 15 * dt; vel.z -= vel.z * 15 * dt;
                            if(STATE.animState === 'walk') STATE.animState = 'idle';
                        }

                        pGrp.position.x += vel.x * dt;
                        pGrp.position.z += vel.z * dt;

                        // Bounds
                        let b = 390;
                        if(pGrp.position.x > b) pGrp.position.x = b; if(pGrp.position.x < -b) pGrp.position.x = -b;
                        if(pGrp.position.z > b) pGrp.position.z = b; if(pGrp.position.z < -b) pGrp.position.z = -b;
                        
                        INTERACTIONS.check(pGrp.position);
                    } else {
                        // Is Interacting Logic
                        if(STATE.interactTarget.type === 'treadmill') {
                            STATE.speed += (1 + STATE.rebirths) * dt * 10;
                            STATE.exp += 5 * dt;
                            if(Math.random() < 0.05) PARTICLES.spawnSweat();
                            GAME.checkLevelUp();
                            
                            // Scroll texture
                            STATE.interactTarget.belt.material.map && (STATE.interactTarget.belt.material.map.offset.y -= dt);
                        }
                    }
                }

                RENDERER.updatePlayerScale();

                // --- ANIMATION STATE MACHINE ---
                if(STATE.animState === 'walk' || STATE.animState === 'run_treadmill') {
                    let speedMult = STATE.animState === 'run_treadmill' ? 25 : 15;
                    animTime += dt * speedMult;
                    rLegGrp.rotation.x = Math.sin(animTime)*0.8; lLegGrp.rotation.x = Math.sin(animTime+Math.PI)*0.8;
                    rArmGrp.rotation.x = Math.sin(animTime+Math.PI)*0.6; lArmGrp.rotation.x = Math.sin(animTime)*0.6;
                } 
                else if(STATE.animState === 'lift') {
                    liftPhase += dt * 5;
                    let p = Math.sin(liftPhase * Math.PI);
                    rArmGrp.rotation.x = -p * Math.PI * 0.8; lArmGrp.rotation.x = -p * Math.PI * 0.8;
                    if(liftPhase >= 1) { STATE.animState = 'idle'; liftPhase = 0; }
                }
                else if(STATE.animState === 'punch') {
                    punchPhase += dt * 8;
                    let p = Math.sin(punchPhase * Math.PI);
                    rArmGrp.rotation.x = -p * Math.PI * 0.5; rArmGrp.rotation.z = p * 0.5;
                    if(punchPhase >= 1) { STATE.animState = 'idle'; punchPhase = 0; }
                }
                else {
                    // Idle
                    rLegGrp.rotation.x = THREE.MathUtils.lerp(rLegGrp.rotation.x, 0, dt*10);
                    lLegGrp.rotation.x = THREE.MathUtils.lerp(lLegGrp.rotation.x, 0, dt*10);
                    rArmGrp.rotation.x = THREE.MathUtils.lerp(rArmGrp.rotation.x, 0, dt*10);
                    lArmGrp.rotation.x = THREE.MathUtils.lerp(lArmGrp.rotation.x, 0, dt*10);
                    rArmGrp.rotation.z = THREE.MathUtils.lerp(rArmGrp.rotation.z, 0, dt*10);
                }

                // Camera Update
                let pS = PLAYER.scale;
                let tgt = pGrp.position.clone().add(new THREE.Vector3(0, 5 * pS, 0));
                let ox = camP.radius * pS * Math.sin(camP.phi) * Math.sin(camP.theta);
                let oy = camP.radius * pS * Math.cos(camP.phi);
                let oz = camP.radius * pS * Math.sin(camP.phi) * Math.cos(camP.theta);

                camera.position.lerp(new THREE.Vector3(tgt.x+ox, tgt.y+oy, tgt.z+oz), 0.15);
                camera.lookAt(tgt);

                PARTICLES.update(dt);
                
                // Throttle UI Updates for performance
                if(Math.random() < 0.1) UI.update();

                renderer.render(scene, camera);
            }
            animate();
        }

        UI.update();
        initEngine();

    </script>
</body>
</html>
