<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JaapGym - 3D Fitness Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #87CEEB;
            user-select: none;
        }
        #game-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud-panel {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #4CAF50;
            border-radius: 10px;
            padding: 15px;
            color: white;
            pointer-events: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #stats-panel {
            width: 250px;
        }
        .stat-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .stat-value {
            color: #FFD700;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 1.1rem;
            text-shadow: 1px 1px 2px black;
        }
        #upgrade-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 30, 0.95);
            border: 3px solid #FF9800;
            border-radius: 15px;
            padding: 30px;
            width: 400px;
            color: white;
            display: none;
            pointer-events: auto;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
        }
        .menu-title {
            text-align: center;
            font-size: 2rem;
            color: #FF9800;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .upgrade-btn {
            background: linear-gradient(to bottom, #4CAF50, #45a049);
            border: none;
            border-radius: 5px;
            padding: 15px;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }
        .upgrade-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.6);
        }
        .upgrade-btn:active {
            transform: scale(0.95);
        }
        .upgrade-btn.locked {
            background: linear-gradient(to bottom, #555, #333);
            color: #888;
            cursor: not-allowed;
        }
        #close-menu {
            background: #f44336;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            margin-top: 10px;
        }
        #close-menu:hover { background: #d32f2f; }
        .notification {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
            color: #00FF00;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-layer">
        <div id="stats-panel" class="hud-panel">
            <div class="stat-line"><span>Strength:</span> <span id="val-strength" class="stat-value">0</span></div>
            <div class="stat-line"><span>Coins:</span> <span id="val-coins" class="stat-value">0</span></div>
            <div class="stat-line"><span>Multiplier:</span> <span id="val-mult" class="stat-value">x1</span></div>
            <div class="stat-line"><span>Weight:</span> <span id="val-weight" class="stat-value">1 kg</span></div>
            <button id="btn-open-upgrades" style="width:100%; margin-top:15px; padding:10px; background:#FF9800; border:none; border-radius:5px; color:white; font-weight:bold; cursor:pointer;">UPGRADES (U)</button>
        </div>
        <div id="controls-hint" class="hud-panel">
            W,A,S,D / Arrows to Move | SPACE to Lift | U to Open Shop
        </div>
    </div>

    <div id="upgrade-menu">
        <h2 class="menu-title">Gym Shop</h2>
        <button class="upgrade-btn" id="upg-weight" onclick="purchaseUpgrade('weight')">
            <span>Heavier Weight</span>
            <span id="cost-weight">10 Coins</span>
        </button>
        <button class="upgrade-btn" id="upg-dna" onclick="purchaseUpgrade('dna')">
            <span>Muscle DNA (Multiplier)</span>
            <span id="cost-dna">100 Coins</span>
        </button>
        <button class="upgrade-btn" id="upg-sell" onclick="sellStrength()" style="background: linear-gradient(to bottom, #2196F3, #1976D2); margin-top: 20px;">
            <span>Sell Strength for Coins</span>
            <span>(Max Profit)</span>
        </button>
        <button id="close-menu" onclick="toggleMenu()">Close</button>
    </div>

    <div id="level-up-text" class="notification">LEVEL UP!</div>

    <script type="module">
        import * as THREE from 'three';

        // --- GAME STATE ---
        const gameState = {
            strength: 0,
            coins: 0,
            multiplier: 1,
            weightPower: 1,
            costs: {
                weight: 10,
                dna: 100
            },
            lifting: false,
            liftCooldown: 0,
            isMenuOpen: false
        };

        // --- THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(20, 50, -20);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- ENVIRONMENT (GYM) ---
        const floorGeo = new THREE.PlaneGeometry(200, 200);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x333333,
            roughness: 0.8,
            metalness: 0.2
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Grid lines to make it look like gym mats
        const gridHelper = new THREE.GridHelper(200, 100, 0x000000, 0x111111);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // Walls
        function createWall(w, h, d, x, y, z) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.9 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true;
            mesh.castShadow = true;
            scene.add(mesh);
        }
        createWall(100, 20, 2, 0, 10, -50); // North
        createWall(100, 20, 2, 0, 10, 50);  // South
        createWall(2, 20, 100, -50, 10, 0); // West
        createWall(2, 20, 100, 50, 10, 0);  // East

        // Gym Equipment Props (Visual only)
        function createDumbbellRack(x, z) {
            const rackGroup = new THREE.Group();
            
            // Frame
            const frameGeo = new THREE.BoxGeometry(10, 3, 2);
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.2 });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.position.y = 1.5;
            frame.castShadow = true;
            rackGroup.add(frame);

            // Dumbbells
            for(let i=0; i<4; i++) {
                const dbGroup = new THREE.Group();
                const handleGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.8);
                const weightGeo = new THREE.CylinderGeometry(0.4 + (i*0.1), 0.4 + (i*0.1), 0.3);
                const dbMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.6 });
                
                const handle = new THREE.Mesh(handleGeo, dbMat);
                handle.rotation.z = Math.PI / 2;
                
                const w1 = new THREE.Mesh(weightGeo, dbMat);
                w1.rotation.z = Math.PI / 2;
                w1.position.x = -0.4;
                
                const w2 = new THREE.Mesh(weightGeo, dbMat);
                w2.rotation.z = Math.PI / 2;
                w2.position.x = 0.4;

                dbGroup.add(handle, w1, w2);
                dbGroup.position.set(-3.5 + (i * 2.3), 3.3, 0);
                dbGroup.castShadow = true;
                rackGroup.add(dbGroup);
            }
            
            rackGroup.position.set(x, 0, z);
            scene.add(rackGroup);
        }

        createDumbbellRack(-20, -30);
        createDumbbellRack(-20, -20);
        createDumbbellRack(20, -30);

        // Bench Press
        function createBench(x, z, rot) {
            const benchGrp = new THREE.Group();
            const padGeo = new THREE.BoxGeometry(2, 0.5, 6);
            const padMat = new THREE.MeshStandardMaterial({ color: 0x8b0000, roughness: 0.9 });
            const pad = new THREE.Mesh(padGeo, padMat);
            pad.position.y = 1.5;
            pad.castShadow = true;
            benchGrp.add(pad);

            const legGeo = new THREE.CylinderGeometry(0.2, 0.2, 1.5);
            const legMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.7 });
            const l1 = new THREE.Mesh(legGeo, legMat); l1.position.set(-0.8, 0.75, -2.5);
            const l2 = new THREE.Mesh(legGeo, legMat); l2.position.set(0.8, 0.75, -2.5);
            const l3 = new THREE.Mesh(legGeo, legMat); l3.position.set(0, 0.75, 2.5);
            benchGrp.add(l1, l2, l3);

            const barGeo = new THREE.CylinderGeometry(0.1, 0.1, 5);
            const bar = new THREE.Mesh(barGeo, legMat);
            bar.rotation.z = Math.PI / 2;
            bar.position.set(0, 3, -2);
            benchGrp.add(bar);

            const plateGeo = new THREE.CylinderGeometry(1, 1, 0.3);
            const pMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const p1 = new THREE.Mesh(plateGeo, pMat); p1.rotation.z = Math.PI/2; p1.position.set(-2, 3, -2);
            const p2 = new THREE.Mesh(plateGeo, pMat); p2.rotation.z = Math.PI/2; p2.position.set(2, 3, -2);
            benchGrp.add(p1, p2);

            benchGrp.position.set(x, 0, z);
            benchGrp.rotation.y = rot;
            scene.add(benchGrp);
        }

        createBench(15, 10, 0);
        createBench(25, 10, 0);
        createBench(15, 20, 0);

        // --- PLAYER CHARACTER (ROBLOX STYLE BLOCKY) ---
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const skinColor = 0xffcc99;
        const shirtColor = 0x2196F3;
        const pantsColor = 0x333333;

        const headGeo = new THREE.BoxGeometry(1, 1, 1);
        const skinMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.6 });
        const head = new THREE.Mesh(headGeo, skinMat);
        head.position.y = 3.5;
        head.castShadow = true;
        playerGroup.add(head);

        const torsoGeo = new THREE.BoxGeometry(2, 2, 1);
        const torsoMat = new THREE.MeshStandardMaterial({ color: shirtColor });
        const torso = new THREE.Mesh(torsoGeo, torsoMat);
        torso.position.y = 2;
        torso.castShadow = true;
        playerGroup.add(torso);

        // Arms structure for animation
        const armGeo = new THREE.BoxGeometry(0.8, 2, 0.8);
        
        const leftArmGroup = new THREE.Group();
        leftArmGroup.position.set(-1.5, 2.5, 0);
        const leftArm = new THREE.Mesh(armGeo, skinMat);
        leftArm.position.y = -0.5; // Offset for pivot
        leftArm.castShadow = true;
        leftArmGroup.add(leftArm);
        playerGroup.add(leftArmGroup);

        const rightArmGroup = new THREE.Group();
        rightArmGroup.position.set(1.5, 2.5, 0);
        const rightArm = new THREE.Mesh(armGeo, skinMat);
        rightArm.position.y = -0.5;
        rightArm.castShadow = true;
        rightArmGroup.add(rightArm);
        playerGroup.add(rightArmGroup);

        const legGeo = new THREE.BoxGeometry(0.9, 2, 0.9);
        const legMat = new THREE.MeshStandardMaterial({ color: pantsColor });
        
        const leftLegGroup = new THREE.Group();
        leftLegGroup.position.set(-0.5, 1, 0);
        const leftLeg = new THREE.Mesh(legGeo, legMat);
        leftLeg.position.y = -0.5;
        leftLeg.castShadow = true;
        leftLegGroup.add(leftLeg);
        playerGroup.add(leftLegGroup);

        const rightLegGroup = new THREE.Group();
        rightLegGroup.position.set(0.5, 1, 0);
        const rightLeg = new THREE.Mesh(legGeo, legMat);
        rightLeg.position.y = -0.5;
        rightLeg.castShadow = true;
        rightLegGroup.add(rightLeg);
        playerGroup.add(rightLegGroup);

        // Equipped Dumbbell
        const equipGroup = new THREE.Group();
        const eHandleGeo = new THREE.CylinderGeometry(0.1, 0.1, 1);
        const eWeightGeo = new THREE.BoxGeometry(0.6, 0.6, 0.4);
        const eMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
        const eHandle = new THREE.Mesh(eHandleGeo, eMat);
        const ew1 = new THREE.Mesh(eWeightGeo, eMat); ew1.position.y = 0.4;
        const ew2 = new THREE.Mesh(eWeightGeo, eMat); ew2.position.y = -0.4;
        equipGroup.add(eHandle, ew1, ew2);
        
        // Attach to right hand
        equipGroup.position.set(0, -1.2, 0.5);
        equipGroup.rotation.x = Math.PI / 2;
        rightArmGroup.add(equipGroup);

        // Camera Setup (3rd Person Spring Arm)
        const cameraOffset = new THREE.Vector3(0, 5, 12);
        const cameraTarget = new THREE.Vector3(0, 2, 0);

        // --- INPUT HANDLING ---
        const keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowdown: false, arrowleft: false, arrowright: false, space: false };
        
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if(keys.hasOwnProperty(key)) keys[key] = true;
            if(key === 'u') toggleMenu();
            if(key === ' ' || key === 'space') doLift();
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if(keys.hasOwnProperty(key)) keys[key] = false;
        });

        document.getElementById('btn-open-upgrades').addEventListener('click', toggleMenu);

        // --- GAME LOGIC ---
        window.toggleMenu = function() {
            gameState.isMenuOpen = !gameState.isMenuOpen;
            document.getElementById('upgrade-menu').style.display = gameState.isMenuOpen ? 'flex' : 'none';
        }

        window.doLift = function() {
            if(gameState.lifting || gameState.isMenuOpen) return;
            gameState.lifting = true;
            
            // Add strength based on weight power and DNA multiplier
            const gain = gameState.weightPower * gameState.multiplier;
            gameState.strength += gain;
            
            // Update UI
            updateUI();
            
            // Animation reset handled in main loop
            gameState.liftCooldown = 0.5; // seconds
        }

        window.purchaseUpgrade = function(type) {
            const cost = gameState.costs[type];
            if(gameState.coins >= cost) {
                gameState.coins -= cost;
                
                if(type === 'weight') {
                    gameState.weightPower += 1;
                    gameState.costs.weight = Math.floor(gameState.costs.weight * 1.5);
                    // Make dumbbell bigger visually
                    const scale = 1 + (gameState.weightPower * 0.1);
                    ew1.scale.set(scale, scale, scale);
                    ew2.scale.set(scale, scale, scale);
                    
                    // Make player slightly bigger
                    const pScale = 1 + (gameState.weightPower * 0.05);
                    if(pScale < 3) playerGroup.scale.set(pScale, pScale, pScale);
                } 
                else if(type === 'dna') {
                    gameState.multiplier += 1;
                    gameState.costs.dna = Math.floor(gameState.costs.dna * 2.5);
                    showNotification("DNA UPGRADED!");
                }
                updateUI();
            }
        }

        window.sellStrength = function() {
            if(gameState.strength > 0) {
                const earned = Math.floor(gameState.strength * 2);
                gameState.coins += earned;
                gameState.strength = 0;
                showNotification(`SOLD FOR ${earned} COINS!`);
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('val-strength').innerText = Math.floor(gameState.strength);
            document.getElementById('val-coins').innerText = Math.floor(gameState.coins);
            document.getElementById('val-mult').innerText = `x${gameState.multiplier}`;
            document.getElementById('val-weight').innerText = `${gameState.weightPower * 5} kg`;

            // Button states
            const btnWeight = document.getElementById('upg-weight');
            document.getElementById('cost-weight').innerText = `${gameState.costs.weight} Coins`;
            if(gameState.coins >= gameState.costs.weight) btnWeight.classList.remove('locked');
            else btnWeight.classList.add('locked');

            const btnDna = document.getElementById('upg-dna');
            document.getElementById('cost-dna').innerText = `${gameState.costs.dna} Coins`;
            if(gameState.coins >= gameState.costs.dna) btnDna.classList.remove('locked');
            else btnDna.classList.add('locked');
        }

        function showNotification(text) {
            const notif = document.getElementById('level-up-text');
            notif.innerText = text;
            notif.style.opacity = 1;
            setTimeout(() => { notif.style.opacity = 0; }, 1500);
        }

        // --- MAIN LOOP ---
        const clock = new THREE.Clock();
        const moveSpeed = 15;
        const rotSpeed = 5;
        let walkTime = 0;

        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();

            if(!gameState.isMenuOpen) {
                // Movement
                let isMoving = false;
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(playerGroup.quaternion);
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(playerGroup.quaternion);

                const velocity = new THREE.Vector3();

                if(keys.w || keys.arrowup) { velocity.add(forward); isMoving = true; }
                if(keys.s || keys.arrowdown) { velocity.sub(forward); isMoving = true; }
                
                // Rotational movement for A/D
                if(keys.a || keys.arrowleft) playerGroup.rotation.y += rotSpeed * dt;
                if(keys.d || keys.arrowright) playerGroup.rotation.y -= rotSpeed * dt;

                if(isMoving) {
                    velocity.normalize().multiplyScalar(moveSpeed * dt);
                    
                    // Simple boundary collision
                    const nextPos = playerGroup.position.clone().add(velocity);
                    if(Math.abs(nextPos.x) < 48 && Math.abs(nextPos.z) < 48) {
                        playerGroup.position.copy(nextPos);
                    }

                    // Walking animation
                    walkTime += dt * 15;
                    leftLegGroup.rotation.x = Math.sin(walkTime) * 0.5;
                    rightLegGroup.rotation.x = Math.sin(walkTime + Math.PI) * 0.5;
                    if(!gameState.lifting) {
                        leftArmGroup.rotation.x = Math.sin(walkTime + Math.PI) * 0.5;
                        rightArmGroup.rotation.x = Math.sin(walkTime) * 0.5;
                    }
                } else {
                    walkTime = 0;
                    leftLegGroup.rotation.x = 0;
                    rightLegGroup.rotation.x = 0;
                    if(!gameState.lifting) {
                        leftArmGroup.rotation.x = 0;
                        rightArmGroup.rotation.x = 0;
                    }
                }

                // Lifting Animation Logic
                if(gameState.lifting) {
                    gameState.liftCooldown -= dt;
                    // Bicep curl motion
                    const animProgress = 1 - (gameState.liftCooldown / 0.5);
                    if(animProgress < 0.5) {
                        // Up
                        rightArmGroup.rotation.x = -Math.PI * (animProgress * 2);
                        leftArmGroup.rotation.x = -Math.PI * (animProgress * 2); // Do both arms for fun
                    } else {
                        // Down
                        rightArmGroup.rotation.x = -Math.PI * ((1 - animProgress) * 2);
                        leftArmGroup.rotation.x = -Math.PI * ((1 - animProgress) * 2);
                    }

                    if(gameState.liftCooldown <= 0) {
                        gameState.lifting = false;
                        rightArmGroup.rotation.x = 0;
                        leftArmGroup.rotation.x = 0;
                    }
                }
            }

            // Update Camera (Smoothly follow player)
            const idealOffset = cameraOffset.clone().applyQuaternion(playerGroup.quaternion);
            idealOffset.add(playerGroup.position);
            
            const idealLookat = cameraTarget.clone().applyQuaternion(playerGroup.quaternion);
            idealLookat.add(playerGroup.position);

            const t = 1.0 - Math.pow(0.001, dt);
            camera.position.lerp(idealOffset, t);
            
            // Look at player head area
            const currentLookat = new THREE.Vector3(0,0,0);
            camera.getWorldDirection(currentLookat);
            currentLookat.add(camera.position);
            currentLookat.lerp(idealLookat, t);
            camera.lookAt(currentLookat);

            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize UI values
        updateUI();

        // Start Loop
        animate();
    </script>
</body>
</html>
